[package]
edition = "2024"
name = "jrsonnet-stdlib"
version = "0.5.0-pre98"
authors = ["Yaroslav Bolyukin <iam@lach.pw>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
